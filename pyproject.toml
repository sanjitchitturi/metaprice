[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metaprice"
version = "0.1.0"
description = "Reproducible hierarchical meta-learning experiments for few-shot price-demand modeling."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MetaPrice" }]
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.23",
  "openpyxl>=3.1",
  "pandas>=1.5",
  "pyyaml>=6.0",
  "scikit-learn>=1.2",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools]
packages = ["metaprice"]
